<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yolasal - Premium Logistika</title>
    <!-- CSS faylını bura bağlayırıq. Sənin css qovluğunda components.css olduğu üçün yol belədir -->
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <!-- ÜST MENYU -->
    <header class="navbar">
        <div class="logo-area">
            <img src="img/logo.jpg" alt="Yolasal" class="site-logo">
        </div>
        <nav class="nav-links">
            <ul>
                <li>Services</li>
                <li>Fleet</li>
                <li>About Us</li>
                <li>Tracking</li>
                <li>Contact</li>
            </ul>
        </nav>
        <div class="header-right">
            <span>AZ | EN</span>
            <button class="btn-customer">MÜŞTƏRİ GİRİŞİ</button>
        </div>
    </header>

    <!-- ANA HİSSƏ (ARXA FON BURADA GÖRÜNƏCƏK) -->
    <section class="hero">
        <div class="hero-content">
            <h1>ETİBARLI LOQİSTİKA VƏ DAŞIMA HƏLLƏRİ</h1>
            <p>YOLASAL İLƏ YÜKÜNÜZ QAYDASINDA!</p>
            
            <div class="search-panel">
                <input type="text" placeholder="Yükü...">
                <button class="btn-search">Yükü İzlə</button>
            </div>
        </div>
    </section>

</body>
</html>
