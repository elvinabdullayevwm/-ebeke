<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaşıYol - Logistika Sistemi</title>
    
    <!-- CSS Şəbəkəsi (Dəri) -->
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <div class="auth-container fade-in">
        <!-- Login Bölməsi -->
        <section id="login-section">
            <h2>Giriş</h2>
            <input type="email" id="login-email" placeholder="E-poçt">
            <input type="password" id="login-pass" placeholder="Şifrə">
            <button class="btn-primary" onclick="handleLogin()">Giriş Et</button>
            <p onclick="showSection('register-section')">Hesabın yoxdur? Qeydiyyat</p>
        </section>

        <!-- Qeydiyyat Bölməsi -->
        <section id="register-section" style="display:none;">
            <h2>Qeydiyyat</h2>
            <input type="text" id="reg-name" placeholder="Ad və Soyad">
            <input type="email" id="reg-email" placeholder="E-poçt">
            <button class="btn-primary">Qeydiyyatı Tamamla</button>
            <p onclick="showSection('login-section')">Geri qayıt</p>
        </section>

        <!-- Bazar Meydanı (Marketplace) -->
        <section id="marketplace-section" style="display:none;">
            <h2>Yük Birjası</h2>
            <div id="load-list">
                <!-- Yüklər bura dinamik yığılacaq -->
            </div>
        </section>
    </div>

    <!-- JS Şəbəkəsi (Əzələlər) -->
    <script src="js/api.js"></script>
    <script src="js/ui-controller.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Sistemi işə salan başlanğıc funksiyası
        window.onload = () => {
            console.log("Sistem aktivdir...");
            showSection('login-section');
        };

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            
            // auth.js-dəki funksiyanı çağırırıq
            await login(email, pass);
        }
    </script>
</body>
</html>
