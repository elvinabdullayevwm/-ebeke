<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaşıYol - Şəbəkə Sistemi</title>
    
    <!-- CSS Şəbəkəsi -->
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <div class="auth-container fade-in">
        <section id="login-section">
            <h2>Sistemə Giriş</h2>
            <label>E-poçt</label>
            <input type="email" id="login-email" placeholder="nümunə@mail.com">
            <label>Şifrə</label>
            <input type="password" id="login-pass" placeholder="******">
            <button class="btn-primary" onclick="handleLogin()">Giriş Et</button>
            <p onclick="showSection('register-section')" style="text-align:center; cursor:pointer; margin-top:15px;">Qeydiyyat</p>
        </section>

        <section id="register-section" style="display:none;">
            <h2>Qeydiyyat</h2>
            <input type="text" id="reg-name" placeholder="Ad Soyad">
            <input type="email" id="reg-email" placeholder="E-poçt">
            <button class="btn-primary">Təsdiqlə</button>
            <p onclick="showSection('login-section')" style="text-align:center; cursor:pointer;">Geri qayıt</p>
        </section>

        <section id="marketplace-section" style="display:none;">
            <h2>Yük Birjası</h2>
            <div id="load-list"></div>
        </section>
    </div>

    <!-- JS Şəbəkəsi -->
    <script src="js/api.js"></script>
    <script src="js/ui-controller.js"></script>
    <script src="js/auth.js"></script>

    <script>
        window.onload = () => { showSection('login-section'); };
        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            await login(email, pass);
        }
    </script>
</body>
</html>
